name: TestFlight

# Signs the app and its two extensions with the Apple Developer Program team and uploads the build to TestFlight.
# Start it by hand on a commit whose Build workflow passed: gh workflow run TestFlight --ref main
#
# The run number is the build number. The "## Unreleased" entries of CHANGELOG.md become the build's What to Test text,
# and after the upload the workflow commits a CHANGELOG.md to main where they read "## Build <run number> (<date>)".
# That commit is pushed with the workflow's own token, so it starts no workflow. The app bundled in this run holds the
# file from before that commit, and it shows the Unreleased entries as its own build's, because its build number is
# newer than every build the file lists (Changelog.entries in LastideKit). The notes step below refuses a run whose
# number is not newer, so that rule always holds.
#
# Repository secrets the workflow reads:
#   APPLE_TEAM_ID   the 10-character Team ID from developer.apple.com, Membership details
#   ASC_KEY_ID      the Key ID of an App Store Connect API team key with the Admin role
#   ASC_ISSUER_ID   the Issuer ID shown above the key list
#   ASC_KEY_P8      the full text of the downloaded AuthKey_<Key ID>.p8 file
on:
  workflow_dispatch:

# contents: write lets the last step commit the stamped CHANGELOG.md to main.
permissions:
  contents: write
  actions: read

jobs:
  upload:
    name: Signed build to TestFlight
    runs-on: xcode-27
    # The upload takes about 7 minutes, and App Store Connect may take up to 45 more to process the build.
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      # The test relay the build accepts beside relay.example. A secret keeps its host out of the public code
      # and masks it in the logs.
      LASTIDE_TEST_RELAY_ORIGIN: ${{ secrets.LASTIDE_TEST_RELAY_ORIGIN }}
    steps:
      - name: Stop unless the Build workflow passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$GITHUB_SHA&status=success" \
            --jq '.total_count')
          if [ "$passed" -lt 1 ]; then
            echo "::error::The Build workflow has not passed on $GITHUB_SHA. Push to main and wait for it to pass."
            exit 1
          fi
          echo "The Build workflow passed on $GITHUB_SHA in $passed runs."
      - name: Stop when a secret is missing
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 LASTIDE_TEST_RELAY_ORIGIN; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              exit 1
            fi
          done
      - uses: actions/checkout@v7
      # Before any build step, so a run without notes stops at once. The scripts are copied, because the last step
      # checks out the newest main.
      - name: Take this build's notes from the Unreleased section of CHANGELOG.md
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci"
          cp scripts/ci/changelog.py scripts/ci/testflight_notes.py "$RUNNER_TEMP/ci/"
          python3 "$RUNNER_TEMP/ci/changelog.py" notes --build "${{ github.run_number }}" > "$RUNNER_TEMP/notes.txt"
          echo "What to Test of build ${{ github.run_number }}:"
          cat "$RUNNER_TEMP/notes.txt"
      - name: Write the API key file
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      # The archive step does not sign. Development signing needs a registered test device, and a TestFlight build
      # does not. The export step signs with a distribution certificate.
      - name: Archive with signing off
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Lastide.xcodeproj \
            -scheme Lastide \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Lastide.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            LASTIDE_RELAY_ORIGINS="https://relay.example $LASTIDE_TEST_RELAY_ORIGIN" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" | xcbeautify
      # The export takes the entitlements from the signatures of the archive, and the unsigned archive has none.
      - name: Sign the app and its two extensions ad hoc with their entitlements
        run: bash scripts/ci/sign_with_entitlements.sh build/Lastide.xcarchive
      # Design section 6.9: one export to a folder first, and a check of the three bundles' entitlements and build
      # numbers. The upload below runs only when the check passes.
      - name: Export once and check the entitlements of the three bundles
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportCheck.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive             -archivePath build/Lastide.xcarchive             -exportOptionsPlist "$RUNNER_TEMP/ExportCheck.plist"             -exportPath build/check             -allowProvisioningUpdates             -authenticationKeyPath "$ASC_KEY_PATH"             -authenticationKeyID "$ASC_KEY_ID"             -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          bash scripts/ci/check_export.sh build/check/Lastide.ipa "$APPLE_TEAM_ID"
      - name: Export and upload to App Store Connect
        id: upload
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Lastide.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      # The localization can be written once App Store Connect has processed the build. The step fails, and names the
      # build, when processing takes longer than the limit or the API refuses.
      - name: Set the build's What to Test text
        run: |
          python3 "$RUNNER_TEMP/ci/testflight_notes.py" --bundle-id dev.lastide.app --build "${{ github.run_number }}"             --notes "$RUNNER_TEMP/notes.txt" --wait-minutes 45
      - name: Delete the API key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
      # Runs once the upload passed, even when the notes step failed, because the build number is spent either way.
      # The commit takes the author of the commit this run built, which the repository hooks checked when it was pushed.
      - name: Record this build in CHANGELOG.md on main
        if: always() && steps.upload.outcome == 'success'
        run: |
          set -euo pipefail
          build="${{ github.run_number }}"
          name="$(git log -1 --format=%an "$GITHUB_SHA")"
          email="$(git log -1 --format=%ae "$GITHUB_SHA")"
          case "$email" in
            *@users.noreply.github.com) ;;
            *) echo "::error::the built commit's author email is no GitHub noreply address"; exit 1 ;;
          esac
          if [ "$name" != "Lastide" ]; then
            echo "::error::the built commit's author is not Lastide"
            exit 1
          fi
          export GIT_AUTHOR_NAME="$name" GIT_AUTHOR_EMAIL="$email" GIT_COMMITTER_NAME="$name" GIT_COMMITTER_EMAIL="$email"
          date="$(date -u +%F)"
          # Another push may land on main meanwhile, so each try starts from the newest main.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git checkout --quiet -B changelog-stamp FETCH_HEAD
            python3 "$RUNNER_TEMP/ci/changelog.py" stamp --build "$build" --date "$date" --notes "$RUNNER_TEMP/notes.txt"
            git add CHANGELOG.md
            git commit --quiet -m "Record build $build in the changelog"
            if git push --quiet origin HEAD:main; then
              echo "CHANGELOG.md on main now lists build $build ($date)."
              exit 0
            fi
            echo "main moved during the push; try $attempt of 3 failed"
          done
          echo "::error::could not push the stamped CHANGELOG.md; run scripts/ci/changelog.py stamp by hand (see README)"
          exit 1
